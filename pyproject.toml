[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "corridorkey-v2-mlx"
version = "0.1.0"
description = "CorridorKey v2 matting on Apple Silicon: MLX inference and command-line export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "Peter Teravskis"}]
license = "Apache-2.0"
dependencies = [
  "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=1.26,<2",
  "torch==2.9.1",
  "opencv-python==4.11.0.86",
  "safetensors>=0.6,<1",
]

[project.optional-dependencies]
download = ["huggingface-hub>=0.36,<2"]
dev = ["pytest>=8", "psutil>=7"]
plots = ["matplotlib>=3.9"]

[project.scripts]
corridorkey-mlx = "corridorkey_mlx.cli:main"

[project.urls]
Repository = "https://github.com/peterteravskis/corridorkey-v2-mlx"
Models = "https://huggingface.co/cdelta/CorridorKey-v2-MLX"

[tool.setuptools.packages.find]
include = ["corridorkey_mlx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
