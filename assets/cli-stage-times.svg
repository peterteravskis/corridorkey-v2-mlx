  </g>
  <g id="text_16">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b6bec9" x="55.44" y="85.248" transform="rotate(-0 55.44 85.248)">32 moving frames · reference and enabled kernels · same input and precision in each pair</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #b6bec9" transform="translate(55.44 541.89)">Breakdown uses the median-duration measured run in each condition. Calls include their CPU/MLX tensor bridges; rendering is evaluated.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #b6bec9" transform="translate(55.44 555.84)">Other includes decoding, preparation, feature staging, temporal blending, scheduling, and scratch cleanup. All output writes are included.</text>
  </g>
